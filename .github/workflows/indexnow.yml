name: Ping IndexNow on deploy
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 90  # let Pages finish deploying
          urls=$(curl -s https://aoaudit.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          echo "Pinging IndexNow with URLs: ${urls}"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"aoaudit.com\",\"key\":\"6a4a62df61505caa89ffd7a7bb584b47\",\"urlList\":[${urls}]}" \
            -o /dev/null -w "IndexNow bulk ping: HTTP %{http_code}\n"
